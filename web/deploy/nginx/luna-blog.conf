# Luna Blog 部署 Nginx 配置（宝塔面板）
# 用法：宝塔"网站"添加站点后，用本文件内容替换站点配置文件
#      或直接放入 /www/server/panel/vhost/nginx/luna-blog.conf
# 无域名方案：监听 8080，通过 http://服务器IP:8080 访问

server {
    listen 8080;
    server_name _;

    # 前端构建产物目录
    root /www/wwwroot/luna-blog/web/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA 路由回退（刷新非首页不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API：去掉 /api 前缀转发到 8890（后端路由本身无 /api 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:8890/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # AI 问答 SSE 流式：必须关缓冲，否则打字机效果失效
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 本地文件上传目录（后端 r.Static("/uploads", "./uploads")）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8890/;
        proxy_set_header Host $host;
    }
}
