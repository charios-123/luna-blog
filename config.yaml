# AI 能力配置(智谱 GLM Flash 完全免费)
ai:
  provider: zhipu # AI 服务商标识
  base_url: https://open.bigmodel.cn/api/paas/v4
  api_key: "" # 通过环境变量 AI_API_KEY 注入,勿写入本文件
  model: glm-4-flash-250414 # GLM-4-Flash 完全免费无 Token 限制(并发更高更稳定,比 glm-4.7-flash 抗压)
  timeout: 60 # 单次请求超时(秒)
  max_content_chars: 8000 # 发送给模型的文章正文最大字符数

log:
  level: debug # debug, info, warn, error
  format: text # json, text
  output: stdout # stdout, file
  file_path: logs/app.log
  max_size: 100 # MB
  max_backups: 3
  max_age: 7 # days
