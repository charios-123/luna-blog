# AI 能力配置(DeepSeek 官方 OpenAI 兼容接口)
ai:
  provider: deepseek # AI 服务商标识
  base_url: https://api.deepseek.com # DeepSeek 官方接口
  api_key: "" # 通过环境变量 AI_API_KEY 注入,勿写入本文件
  model: deepseek-chat # DeepSeek-V3 系列对话模型
  timeout: 60 # 单次请求超时(秒)
  max_content_chars: 8000 # 发送给模型的文章正文最大字符数

log:
  level: debug # debug, info, warn, error
  format: text # json, text
  output: stdout # stdout, file
  file_path: logs/app.log
  max_size: 100 # MB
  max_backups: 3
  max_age: 7 # days
